name: Ultimate Zip Extraction Jutsu ⚔️

on:
  workflow_dispatch: # Aap isko manually GitHub Actions tab se trigger kar sakte hain

permissions:
  contents: write    # Git commit aur push karne ke liye zaroori permission

jobs:
  clean-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true            # zip Git LFS mein stored hai, iske bina sirf pointer file aati hai

      - name: Verify Zip File is Valid 🔍
        run: |
          echo "Zip file ki jaanch ho rahi hai..."
          ls -lh Custom---made-main-wired.zip

          # Agar file LFS pointer hai to ye chhoti (~130 bytes) hogi, real zip nahi
          FILESIZE=$(stat -c%s Custom---made-main-wired.zip)
          if [ "$FILESIZE" -lt 1000 ]; then
            echo "❌ ERROR: Zip file bohot chhoti hai ($FILESIZE bytes). Ye ek LFS pointer ho sakti hai, real zip nahi."
            cat Custom---made-main-wired.zip
            exit 1
          fi

          # Actual zip integrity test
          if ! unzip -tq Custom---made-main-wired.zip > /dev/null 2>&1; then
            echo "❌ ERROR: Zip file corrupt hai ya valid zip nahi hai."
            exit 1
          fi

          echo "✅ Zip file valid hai, size: $FILESIZE bytes"

      - name: Clean Repo, Extract, and Delete Zip 🧹
        run: |
          echo "Mission start! Safai abhiyan shuru..."

          # Step 1: Zip file ko temporary safe jagah move karna
          mv Custom---made-main-wired.zip /tmp/

          # Step 2: Sab kuch delete karna (lekin .git aur .github ko bacha kar!)
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          echo "Enemy files destroyed!"

          # Step 3: Zip ko wapas lana
          mv /tmp/Custom---made-main-wired.zip .

          # Step 4: Zip ko extract karna (.github/workflows/ ko skip karke,
          # kyunki default token workflow files push nahi kar sakta)
          unzip -o Custom---made-main-wired.zip -x ".github/workflows/*"
          echo "Zip extracted successfully!"

          # Step 5: Zip file ka khatma
          rm Custom---made-main-wired.zip
          echo "Zip file deleted. Mission accomplished!"

      - name: Commit and Push Changes 🚀
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .

          # Agar koi changes hain toh hi commit karega, warna error nahi dega
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-extracted zip and cleaned repo 🌸" && git push)

name: Extract Zip and Clean Repo

on:
  workflow_dispatch:

# Fix 1: GitHub Actions Bot ko Write Permissions dena mandatory hai
permissions:
  contents: write

jobs:
  clean-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Step 1 - Remove Old Files (Except target zip and workflow)
        run: |
          echo "Preserving zip and workflow file..."
          cp Custom---made-main.zip /tmp/Custom---made-main.zip
          
          # Fix 2: Workflow folder (.github) delete hone se bachaya
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +

      - name: Step 2 - Extract Zip Content
        run: |
          echo "Extracting zip file..."
          unzip /tmp/Custom---made-main.zip -d .
          
          if [ -d "Custom---made-main" ]; then
            mv Custom---made-main/* . 2>/dev/null || true
            mv Custom---made-main/.* . 2>/dev/null || true
            rm -rf Custom---made-main
          fi

      - name: Step 3 - Remove Zip File
        run: |
          rm -f /tmp/Custom---made-main.zip
          rm -f Custom---made-main.zip

      - name: Step 4 - Commit and Push Changes back to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-clean, extract Custom---made-main.zip, and remove archive" || echo "No changes to commit"
          git push origin HEAD:main
